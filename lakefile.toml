name = "SiegelAllCharacters"
version = "0.1.0"
defaultTargets = ["SiegelAllCharacters"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# Every module of the closure is a build target (globs), not only those the root reaches.
[[lean_lib]]
name = "SiegelAllCharacters"
roots = ["SiegelAllCharacters"]
globs = ["SiegelAllCharacters", "OAI.+"]
